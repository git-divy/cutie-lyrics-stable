[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutie-lyrics"
version = "0.1.0"
description = "Create lyric-video assets from Spotify track URLs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "git-divy" },
]
keywords = ["lyrics", "manim", "music", "spotify", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "beautifulsoup4",
    "fonttools",
    "google-genai",
    "manim",
    "pydantic",
    "pydub",
    "python-dotenv",
    "requests",
    "spotapi",
    "spotdl",
    "yt-dlp",
]

[project.optional-dependencies]
beta = [
    "librosa",
    "matplotlib",
    "numpy",
    "whisperx",
]

[project.scripts]
cutie = "cutie:main"

[tool.setuptools]
py-modules = [
    "app",
    "cutie",
    "description",
    "description_helper",
    "fetch_lyrics",
    "fetch_metadata_sp",
    "lyr_dev",
    "thumbnail_dev",
    "timestamp_parser",
    "transliteration",
    "utilsx",
]
